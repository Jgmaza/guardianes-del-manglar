name: Deploy Vercel (main)

# Production deploys only from main. Integration stays on dev → PR → main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel-main
  cancel-in-progress: false

jobs:
  deploy:
    name: vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync production env to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ENABLE_SUPABASE: ${{ secrets.NEXT_PUBLIC_ENABLE_SUPABASE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          upsert() {
            local key="$1"
            local val="$2"
            [ -n "$val" ] || return 0
            npx vercel@latest env rm "$key" production --yes --token="$VERCEL_TOKEN" 2>/dev/null || true
            printf '%s' "$val" | npx vercel@latest env add "$key" production --token="$VERCEL_TOKEN"
          }
          upsert NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
          upsert NEXT_PUBLIC_SUPABASE_ANON_KEY "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          # Always on for production so the CRA panel can hydrate from Postgres.
          upsert NEXT_PUBLIC_ENABLE_SUPABASE "true"
          upsert SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          upsert NEXT_PUBLIC_APP_NAME "${NEXT_PUBLIC_APP_NAME:-Guardianes del Manglar}"
          upsert NEXT_PUBLIC_APP_URL "${NEXT_PUBLIC_APP_URL:-https://guardianes-del-manglar.vercel.app}"

      - name: Pull Vercel env
        run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # `vercel pull` redacts Sensitive secrets as [SENSITIVE]. Also write apps/web/.env.production
      # so Next.js (Root Directory apps/web) inlines NEXT_PUBLIC_* during vercel build.
      - name: Materialize server secrets for build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          write_env() {
            local file="$1"
            mkdir -p "$(dirname "$file")"
            touch "$file"
            for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_ENABLE_SUPABASE SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_APP_NAME NEXT_PUBLIC_APP_URL; do
              grep -v "^${key}=" "$file" > "${file}.tmp" || true
              mv "${file}.tmp" "$file"
            done
            {
              echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
              echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
              echo "NEXT_PUBLIC_ENABLE_SUPABASE=true"
              echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
              echo "NEXT_PUBLIC_APP_NAME=Guardianes del Manglar"
              echo "NEXT_PUBLIC_APP_URL=https://guardianes-del-manglar.vercel.app"
            } >> "$file"
            echo "wrote $file keys=$(cut -d= -f1 "$file" | paste -sd, -)"
            grep -q '^NEXT_PUBLIC_ENABLE_SUPABASE=true$' "$file"
            grep -q '^NEXT_PUBLIC_SUPABASE_URL=https://' "$file"
            test -n "$(grep '^SUPABASE_SERVICE_ROLE_KEY=' "$file" | cut -d= -f2-)"
          }
          write_env ".vercel/.env.production.local"
          write_env "apps/web/.env.production"

      - name: Build
        run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_ENABLE_SUPABASE: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
